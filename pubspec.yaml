name: eagle_cargo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  firebase_remote_config: ^6.1.4
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^20.0.0
  connectivity_plus: ^7.0.0
  shared_preferences: ^2.5.4
  http: ^1.6.0
  provider: ^6.1.5+1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  smooth_page_indicator: ^2.0.1
  curved_navigation_bar: ^1.0.6
  lottie: ^3.3.2
  photo_view: ^0.15.0
  transparent_image: ^2.0.1
  intl: ^0.20.2
  new_version_plus: ^1.0.1
  cached_network_image: ^3.4.1
  package_info_plus: ^9.0.0
  kargoo_core:
    path: packages/kargoo_core
  mobile_scanner: ^7.2.0
  toastification: ^3.1.0
  smart_auth: ^3.2.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_widget_from_html_core: ^0.17.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_logo.jpg"
  background_color: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/

